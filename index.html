<!doctype html>
<html lang="en" class="anim">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <title>Orbit — Secure system</title>
  <style>
    /* CSS Variables */
    :root {
      --ink: #ffffff;
      --surface: #161616;
      --orb-reveal: cubic-bezier(.16, 1, .3, 1);
      --orb-soft: cubic-bezier(.25, .8, .28, 1);
    }

    @font-face {
      font-family: 'Orbit Sans';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: local('Orbit Sans'), local('Space Grotesk'), local('Helvetica Neue'), local('Arial'), sans-serif;
    }

    @font-face {
      font-family: 'Orbit Display';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: local('Orbit Display'), local('Times New Roman'), local('Times'), serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--surface);
      color: var(--ink);
      font-family: 'Orbit Sans', Arial, Helvetica, sans-serif;
      user-select: none;
    }

    .viewport {
      position: fixed;
      inset: 0;
      background: #000000;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 0;
      contain: strict;
      isolation: isolate;
      background: var(--surface);
      overflow: hidden;
      cursor: crosshair;
    }

    /* Z-order: wordmark 1 -> flower 2 -> corner copy 3 -> brand/nav/pill 4. Mobile: scrim 9, sheet 10, burger 12 */

    /* Brand mark */
    .brand-mark {
      position: absolute;
      top: 2.141745dvh;
      left: 3.854167vw;
      width: clamp(34px, min(3.4375vw, 5.2dvh), 66px);
      height: auto;
      z-index: 4;
      pointer-events: none;
    }

    /* Primary nav */
    .primary-nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      list-style: none;
    }

    .primary-nav li {
      position: absolute;
      top: 3.426791dvh;
    }

    .primary-nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      letter-spacing: 0.02em;
      pointer-events: auto;
      display: inline-block;
      transition: opacity 0.2s ease;
    }

    .primary-nav a:hover {
      opacity: 0.75;
    }

    .nav-home { left: 10.104167vw; transform: scaleX(1.165); transform-origin: left center; }
    .nav-resources { left: 17.526042vw; transform: scaleX(1.052); transform-origin: left center; }
    .nav-benefits { left: 27.578125vw; transform: scaleX(1.126); transform-origin: left center; }
    .nav-contact { left: 36.171875vw; transform: scaleX(1.168); transform-origin: left center; }

    /* Secure system pill */
    .secure-pill {
      position: absolute;
      top: 2.336449dvh;
      right: 7.5vw;
      height: clamp(34px, 4.439252dvh, 57px);
      padding: 0 clamp(18px, 2.2vw, 36px);
      background: #ffffff;
      color: #161616;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 24px);
      font-weight: 500;
      letter-spacing: 0.026923em;
      text-decoration: none;
      z-index: 4;
      pointer-events: auto;
      white-space: nowrap;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .secure-pill:hover {
      transform: scale(1.02);
      background-color: #f0f0f0;
    }

    /* Wordmark ORBIT */
    .orbit-word {
      position: absolute;
      top: 11.565421dvh;
      left: 4.348958vw;
      font-family: 'Orbit Display', "Times New Roman", Times, serif;
      font-size: min(27.8125vw, 55dvh);
      line-height: 0.85;
      letter-spacing: 0.033708em;
      font-weight: 400;
      z-index: 1;
      pointer-events: none;
      margin: 0;
    }

    .orbit-word__mask {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
      margin-bottom: -0.08em;
    }

    .orbit-word__inner {
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    .orbit-word__white {
      color: #ffffff;
    }

    .orbit-word__o {
      display: inline-block;
      transform: scaleX(1.0866);
      transform-origin: center center;
      margin-right: 0.042135em;
    }

    .orbit-word__pink {
      background: linear-gradient(180deg, #ffc5dc 0%, #fd86db 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      display: inline-block;
    }

    /* Flower stack */
    .flower {
      position: absolute;
      top: 14.749065dvh;
      left: 49.121328vw;
      height: 106.109034dvh;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 2;
    }

    .flower__sizer {
      height: 100%;
      width: auto;
      visibility: hidden;
      display: block;
      pointer-events: none;
    }

    .flower__layer {
      position: absolute;
      inset: 0;
      mask-size: 100% 100%;
      -webkit-mask-size: 100% 100%;
      mask-repeat: no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-position: center;
      -webkit-mask-position: center;
    }

    .flower__layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .flower__layer--top {
      mask-image: linear-gradient(#0000, #0000);
      -webkit-mask-image: linear-gradient(#0000, #0000);
    }

    /* Corner copy */
    .support-copy {
      position: absolute;
      bottom: 4.361371dvh;
      color: #f7f7f7;
      font-size: clamp(14px, min(1.40625vw, 2.102804dvh), 27px);
      line-height: 1.35;
      z-index: 3;
      pointer-events: none;
    }

    .support-copy--left {
      left: 3.177083vw;
    }

    .support-copy--left .support-copy__inner {
      transform: scaleX(1.073);
      transform-origin: left bottom;
    }

    .support-copy--right {
      left: 78.28125vw;
    }

    .support-copy--right .support-copy__inner {
      transform: scaleX(1.058);
      transform-origin: left bottom;
    }

    /* Mobile Menu Chrome */
    .burger-btn {
      display: none;
      position: absolute;
      top: 2.5dvh;
      right: 4vw;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      cursor: pointer;
      z-index: 12;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      padding: 0;
    }

    .burger-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background: #161616;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .mobile-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .mobile-sheet {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(80vw, 320px);
      background: rgba(22, 22, 22, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.35s var(--orb-reveal);
      padding: 80px 32px 40px;
      flex-direction: column;
      justify-content: space-between;
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .mobile-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .mobile-nav-list a {
      color: #fff;
      font-size: 24px;
      text-decoration: none;
      letter-spacing: 0.04em;
    }

    /* Mobile active state */
    body.menu-open .mobile-scrim {
      opacity: 1;
      pointer-events: auto;
    }

    body.menu-open .mobile-sheet {
      transform: translateX(0);
    }

    body.menu-open .burger-btn span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    body.menu-open .burger-btn span:nth-child(2) {
      opacity: 0;
    }
    body.menu-open .burger-btn span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .orbit-word {
        left: 0;
        width: 100%;
        text-align: center;
      }
      .orbit-word__inner {
        justify-content: center;
      }
    }

    @media (max-width: 900px), (max-aspect-ratio: 4 / 5) {
      .primary-nav, .secure-pill {
        display: none !important;
      }
      .burger-btn, .mobile-scrim, .mobile-sheet {
        display: flex;
      }
      .flower {
        top: 24dvh;
        height: min(55dvh, 110vw);
      }
      .orbit-word {
        top: 15dvh;
        font-size: min(27.5vw, 18dvh);
      }
      .support-copy--left {
        left: 5vw;
        bottom: 5dvh;
      }
      .support-copy--right {
        left: auto;
        right: 5vw;
        bottom: 5dvh;
        text-align: right;
      }
    }

    /* Entrance Animations */
    @keyframes orb-word {
      from { transform: translateY(118%); }
      to { transform: translateY(0); }
    }

    @keyframes orb-subject {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(3.4dvh);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes orb-corner {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes orb-quiet {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes orb-dim {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Animation initial states & triggers */
    html.anim .brand-mark {
      opacity: 0;
      animation: orb-quiet 620ms var(--orb-soft) 100ms forwards;
    }

    html.anim .nav-home {
      opacity: 0;
      animation: orb-dim 550ms var(--orb-soft) 180ms forwards;
    }
    html.anim .nav-resources {
      opacity: 0;
      animation: orb-dim 550ms var(--orb-soft) 225ms forwards;
    }
    html.anim .nav-benefits {
      opacity: 0;
      animation: orb-dim 550ms var(--orb-soft) 270ms forwards;
    }
    html.anim .nav-contact {
      opacity: 0;
      animation: orb-dim 550ms var(--orb-soft) 315ms forwards;
    }

    html.anim .secure-pill {
      opacity: 0;
      animation: orb-quiet 620ms var(--orb-soft) 340ms forwards;
    }

    html.anim .burger-btn {
      opacity: 0;
      animation: orb-quiet 620ms var(--orb-soft) 200ms forwards;
    }

    html.anim .orbit-word__inner {
      transform: translateY(118%);
      animation: orb-word 1150ms var(--orb-reveal) 300ms forwards;
    }

    html.anim .flower {
      opacity: 0;
      animation: orb-subject 1150ms var(--orb-reveal) 660ms forwards;
    }

    html.anim .support-copy--left .support-copy__inner,
    html.anim .support-copy--right .support-copy__inner {
      opacity: 0;
      animation: orb-corner 720ms var(--orb-soft) 980ms forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      html.anim .stage {
        opacity: 0;
        animation: orb-dim 280ms ease forwards;
      }
      html.anim .brand-mark,
      html.anim .primary-nav li,
      html.anim .secure-pill,
      html.anim .burger-btn,
      html.anim .orbit-word__inner,
      html.anim .flower,
      html.anim .support-copy__inner {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="stage" id="stage">
      
      <!-- Brand mark -->
      <svg class="brand-mark" viewBox="0 0 66 62" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="33" y1="1" x2="33" y2="61" stroke="white" stroke-width="5" stroke-linecap="square"/>
        <line x1="3" y1="31" x2="63" y2="31" stroke="white" stroke-width="5" stroke-linecap="square"/>
        <line x1="11.8" y1="9.8" x2="54.2" y2="52.2" stroke="white" stroke-width="5" stroke-linecap="square"/>
        <line x1="54.2" y1="9.8" x2="11.8" y2="52.2" stroke="white" stroke-width="5" stroke-linecap="square"/>
      </svg>

      <!-- Primary nav -->
      <ul class="primary-nav">
        <li class="nav-home"><a href="#home">Home</a></li>
        <li class="nav-resources"><a href="#resources">Resources</a></li>
        <li class="nav-benefits"><a href="#benefits">Benefits</a></li>
        <li class="nav-contact"><a href="#contact">Contact</a></li>
      </ul>

      <!-- Secure system pill -->
      <a href="#secure" class="secure-pill">
        Secure system
      </a>

      <!-- Mobile Hamburger Button -->
      <button class="burger-btn" id="burgerBtn" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Wordmark ORBIT -->
      <h1 class="orbit-word" id="orbit-title" aria-label="Orbit">
        <span class="orbit-word__mask">
          <span class="orbit-word__inner">
            <span class="orbit-word__white"><span class="orbit-word__o">O</span>R</span>
            <span class="orbit-word__pink">BIT</span>
          </span>
        </span>
      </h1>

      <!-- Flower stack -->
      <div class="flower" id="flower">
        <img class="flower__sizer" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85" alt="" aria-hidden="true">
        <div class="flower__layer flower__layer--bg" id="flowerBg">
          <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85" alt="Pixel-art pink lily">
        </div>
        <div class="flower__layer flower__layer--top" id="flowerTop" aria-hidden="true">
          <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85" alt="">
        </div>
      </div>

      <!-- Corner copy -->
      <div class="support-copy support-copy--left">
        <div class="support-copy__inner">
          Every workflow,<br>intelligently connected.
        </div>
      </div>

      <div class="support-copy support-copy--right">
        <div class="support-copy__inner">
          Less manual work.<br>More meaningful output.
        </div>
      </div>

      <!-- Mobile Menu Sheet & Scrim -->
      <div class="mobile-scrim" id="mobileScrim"></div>
      <nav class="mobile-sheet" id="mobileSheet">
        <ul class="mobile-nav-list">
          <li><a href="#home" class="mobile-link">Home</a></li>
          <li><a href="#resources" class="mobile-link">Resources</a></li>
          <li><a href="#benefits" class="mobile-link">Benefits</a></li>
          <li><a href="#contact" class="mobile-link">Contact</a></li>
        </ul>
        <a href="#secure" class="secure-pill" style="display:inline-flex; width:fit-content;">Secure system</a>
      </nav>

    </section>
  </main>

  <script>
    // Constants tuned for fine, interactive morph-reveal trail
    const TRAIL_MAX_POINTS  = 90;
    const TRAIL_HEAD_R      = 34;
    const TRAIL_NOISE_AMP   = 10;
    const TRAIL_BLOB_PTS    = 20;
    const TRAIL_FADE_SPEED  = 0.94;
    const TRAIL_SAMPLE_DIST = 4;

    // Elements
    const stage = document.getElementById('stage');
    const flower = document.getElementById('flower');
    const flowerBg = document.getElementById('flowerBg');
    const flowerTop = document.getElementById('flowerTop');
    const burgerBtn = document.getElementById('burgerBtn');
    const mobileScrim = document.getElementById('mobileScrim');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    // Offscreen canvases for dynamic mask generation
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const topCanvas = document.createElement('canvas');
    const topCtx = topCanvas.getContext('2d');

    // Trail State
    let hovering = false;
    let headRadius = 0;
    let mouseX = 0;
    let mouseY = 0;
    let lastSampleX = -9999;
    let lastSampleY = -9999;
    let points = [];
    let time = 0;

    // Helper: Draw organic morphing blob
    function drawMorphBlob(ctx, cx, cy, r, t, seed, alpha) {
      if (r < 2 || alpha <= 0) return;
      const pts = [];
      for (let i = 0; i < TRAIL_BLOB_PTS; i++) {
        const angle = (i / TRAIL_BLOB_PTS) * Math.PI * 2;
        const n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
        const n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
        const n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
        const noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / TRAIL_HEAD_R);
        const rad = Math.max(0, r + noise);
        pts.push({
          x: cx + Math.cos(angle) * rad,
          y: cy + Math.sin(angle) * rad
        });
      }

      ctx.beginPath();
      const n = pts.length;
      const midX = (pts[n - 1].x + pts[0].x) / 2;
      const midY = (pts[n - 1].y + pts[0].y) / 2;
      ctx.moveTo(midX, midY);

      for (let i = 0; i < n; i++) {
        const next = pts[(i + 1) % n];
        const mx = (pts[i].x + next.x) / 2;
        const my = (pts[i].y + next.y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      ctx.closePath();
      ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, Math.max(0, alpha))})`;
      ctx.fill();
    }

    // Mouse Tracking on Stage
    stage.addEventListener('mousemove', (e) => {
      hovering = true;
      const rect = flower.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });

    stage.addEventListener('mouseenter', () => {
      hovering = true;
    });

    stage.addEventListener('mouseleave', () => {
      hovering = false;
    });

    // Mobile Menu Toggle
    if (burgerBtn) {
      burgerBtn.addEventListener('click', () => {
        document.body.classList.toggle('menu-open');
      });
    }
    if (mobileScrim) {
      mobileScrim.addEventListener('click', () => {
        document.body.classList.remove('menu-open');
      });
    }
    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        document.body.classList.remove('menu-open');
      });
    });

    // Touch support for mobile morph reveal
    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        hovering = true;
        const touch = e.touches[0];
        const rect = flower.getBoundingClientRect();
        mouseX = touch.clientX - rect.left;
        mouseY = touch.clientY - rect.top;
      }
    }, { passive: true });

    stage.addEventListener('touchend', () => {
      hovering = false;
    });

    // Animation Render Loop
    function render() {
      const rect = flower.getBoundingClientRect();
      const W = Math.max(1, Math.round(rect.width));
      const H = Math.max(1, Math.round(rect.height));

      if (bgCanvas.width !== W || bgCanvas.height !== H) {
        bgCanvas.width = W;
        bgCanvas.height = H;
        topCanvas.width = W;
        topCanvas.height = H;
      }

      // Update head radius
      const targetR = hovering ? TRAIL_HEAD_R : 0;
      headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);

      // Add points
      if (hovering && headRadius > 5) {
        const dx = mouseX - lastSampleX;
        const dy = mouseY - lastSampleY;
        if (Math.hypot(dx, dy) >= TRAIL_SAMPLE_DIST) {
          points.push({
            x: mouseX,
            y: mouseY,
            r: headRadius,
            alpha: 1,
            seed: Math.random() * 100
          });
          if (points.length > TRAIL_MAX_POINTS) {
            points.shift();
          }
          lastSampleX = mouseX;
          lastSampleY = mouseY;
        }
      }

      // Decay points
      for (let i = points.length - 1; i >= 0; i--) {
        points[i].alpha *= TRAIL_FADE_SPEED;
        points[i].r *= 0.995;
        if (points[i].alpha < 0.01) {
          points.splice(i, 1);
        }
      }
      time += 0.016;

      // 1. BG Layer Mask: White background with destination-out blobs
      bgCtx.clearRect(0, 0, W, H);
      bgCtx.fillStyle = '#ffffff';
      bgCtx.fillRect(0, 0, W, H);
      bgCtx.globalCompositeOperation = 'destination-out';

      if (headRadius > 2) {
        drawMorphBlob(bgCtx, mouseX, mouseY, headRadius, time, 42, 1);
      }
      for (let i = 0; i < points.length; i++) {
        drawMorphBlob(bgCtx, points[i].x, points[i].y, points[i].r, time, points[i].seed, points[i].alpha);
      }

      // 2. TOP Layer Mask: Transparent canvas with source-over white blobs
      topCtx.clearRect(0, 0, W, H);
      topCtx.globalCompositeOperation = 'source-over';

      if (headRadius > 2) {
        drawMorphBlob(topCtx, mouseX, mouseY, headRadius, time, 42, 1);
      }
      for (let i = 0; i < points.length; i++) {
        drawMorphBlob(topCtx, points[i].x, points[i].y, points[i].r, time, points[i].seed, points[i].alpha);
      }

      // Apply dynamic masks
      const bgData = bgCanvas.toDataURL();
      const topData = topCanvas.toDataURL();

      flowerBg.style.maskImage = `url(${bgData})`;
      flowerBg.style.webkitMaskImage = `url(${bgData})`;
      flowerTop.style.maskImage = `url(${topData})`;
      flowerTop.style.webkitMaskImage = `url(${topData})`;

      requestAnimationFrame(render);
    }

    // Safety timer to clear .anim class
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.documentElement.classList.remove('anim');
      }, 6000);
    });

    requestAnimationFrame(render);
  </script>
</body>
</html>
